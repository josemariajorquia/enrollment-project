{% extends 'base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<a href="{% url 'student_list' %}" class="back">← Back to students</a>

<div class="card" style="max-width: 640px;">
  <h1 style="margin-bottom: 20px;">{{ title }}</h1>

  <form method="post" class="form">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">Save</button>
  </form>
</div>

<style>
  .form p { margin-bottom: 16px; }
  .form label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .form input, .form select, .form textarea {
    width: 100%; padding: 12px 14px; border: 1px solid var(--line);
    border-radius: 10px; font-family: inherit; font-size: 14px; outline: none;
  }
  .form input:focus, .form select:focus, .form textarea:focus { border-color: var(--accent); }
  .btn {
    background: var(--accent); color: #fff; border: none; cursor: pointer;
    padding: 12px 28px; border-radius: 10px; font-family: inherit; font-size: 14px;
  }
  .btn:hover { opacity: .9; }
</style>
{% endblock %}
